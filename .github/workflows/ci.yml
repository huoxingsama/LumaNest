name: Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_ui_logic.cjs
      - run: python -m unittest discover -s tests -p "test_*browser.py" -v
        env:
          CINEMA_BROWSER_TEST: '1'
      - run: python tools/release_check.py
      - run: python -m build
      - run: python tools/verify_installed.py
      - run: python tools/package_source.py
      - run: python tools/verify_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-python-${{ matrix.python }}
          path: dist/
