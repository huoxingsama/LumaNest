name: 功能建议
description: 描述具体使用场景和希望改善的操作
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到的问题
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 希望怎样使用
      description: 说明希望在哪个页面选择或调整，以及是否只影响本机。
    validations:
      required: true
